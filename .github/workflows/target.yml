# The target stage: after each promotion to rtos-actor, the QEMU image runs what the host can't
# show, on a Cortex-M4F. It reports, and blocks nothing: Gate calls it after promote, on the same
# commit, its job continues on error, and rtos-actor's ruleset doesn't require it.
name: Target

on:
  workflow_call:

permissions:
  contents: read

jobs:
  qemu:
    name: qemu-mps2-an386
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Install GNU Arm Embedded and QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib qemu-system-arm
          arm-none-eabi-gcc --version | head -1
          qemu-system-arm --version | head -1
      - name: Build the QEMU image
        run: |
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi-cm4f.cmake \
            -DOO_C_TARGET=mps2_an386 -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      # The host's pure-core tests, through the GoogleTest shim, on the emulated Cortex-M4F.
      - name: The pure core's tests on the target
        run: |
          set -o pipefail
          timeout 300 qemu-system-arm -machine mps2-an386 -cpu cortex-m4 -nographic -monitor none \
            -serial none -semihosting-config enable=on,target=native \
            -kernel build/core_tests.elf | tee core_tests.txt
      - name: Report the core's tests
        if: always()
        run: |
          echo "### The pure core's tests on mps2-an386" >> "$GITHUB_STEP_SUMMARY"
          grep -E 'tests ran|^\[  (PASSED|FAILED)  \]|FAULT' core_tests.txt | sed 's/^/    /' \
            >> "$GITHUB_STEP_SUMMARY"
      # The whole firmware: boots, hosts both lanes, plays a game on each through the shell with
      # the pinsetters driven by a timer interrupt, reads the results, and drives the game task's
      # worst case for its painted stack.
      - name: The firmware's smoke test
        if: always()
        run: |
          set -o pipefail
          timeout 120 qemu-system-arm -machine mps2-an386 -cpu cortex-m4 -nographic -monitor none \
            -serial none -semihosting-config enable=on,target=native \
            -kernel build/mps2_an386_firmware.elf | tee smoke.txt
          grep -q '^SMOKE: PASSED' smoke.txt
      - name: Report the smoke test
        if: always()
        run: |
          echo "### The firmware's smoke test on mps2-an386" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' smoke.txt >> "$GITHUB_STEP_SUMMARY"
      # An estimate, in instructions: one a nanosecond of QEMU's virtual clock under icount.
      - name: The early timing estimate
        if: always()
        run: |
          set -o pipefail
          timeout 120 qemu-system-arm -machine mps2-an386 -cpu cortex-m4 -nographic -monitor none \
            -serial none -semihosting-config enable=on,target=native \
            -icount shift=0,align=off,sleep=off -kernel build/timing.elf | tee timing.txt
          {
            echo "### The early timing estimate, release, at 120 MHz: an estimate"
            sed 's/^/    /' timing.txt
          } >> "$GITHUB_STEP_SUMMARY"
