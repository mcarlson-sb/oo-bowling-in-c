# The same builds the README describes, on every push and pull request: debug, release
# (NDEBUG), undefined-behavior checks and data-race checks. Warnings are errors in all of them.
name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    # Pinned, not ubuntu-latest: that label moves to Ubuntu 26, with a newer GCC, from
    # 2026-10-19. Warnings are errors, so a new compiler could fail the build with no change to
    # the code. Moving to a newer image should be a change of its own.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debug
            flags: ""
          - name: release
            flags: "-DCMAKE_BUILD_TYPE=Release"
          - name: ubsan
            flags: "-DOO_C_SANITIZE=ON"
          - name: tsan
            flags: "-DOO_C_TSAN=ON"
    steps:
      - uses: actions/checkout@v7

      # ThreadSanitizer can't map its shadow memory with the runner's default address-space
      # randomization, and aborts before the first test.
      - name: Allow ThreadSanitizer's memory layout
        if: matrix.name == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake -S . -B build -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ ${{ matrix.flags }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ENG-3.1's complexity limits, on the library's source: cyclomatic complexity at most 10,
  # functions at most 50 lines, at most 4 parameters (lizard), and cognitive complexity at most
  # 7 (clang-tidy, which also reads the inline functions in the headers). Any function over any
  # limit fails the job.
  complexity:
    name: complexity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check ENG-3.1's limits with lizard
        run: pipx run --spec lizard==1.24.0 lizard -C 10 -L 50 -a 4 -w src include

      - name: Check ENG-3.1's cognitive-complexity limit with clang-tidy
        run: >-
          pipx run --spec clang-tidy==18.1.8 clang-tidy
          -checks='-*,readability-function-cognitive-complexity'
          -config='{CheckOptions: {readability-function-cognitive-complexity.Threshold: 7}}'
          -header-filter='(src|include)/.*' -warnings-as-errors='*'
          src/*.c -- -std=c11 -Iinclude -Isrc
