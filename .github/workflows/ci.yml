# The same builds the README describes, on every push and pull request: debug, release
# (NDEBUG), undefined-behavior checks and data-race checks. Warnings are errors in all of them.
name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    # Pinned, not ubuntu-latest: that label moves to Ubuntu 26, with a newer GCC, from
    # 2026-10-19. Warnings are errors, so a new compiler could fail the build with no change to
    # the code. Moving to a newer image should be a change of its own.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debug
            flags: ""
          - name: release
            flags: "-DCMAKE_BUILD_TYPE=Release"
          - name: ubsan
            flags: "-DOO_C_SANITIZE=ON"
          - name: tsan
            flags: "-DOO_C_TSAN=ON"
    steps:
      - uses: actions/checkout@v7

      # ThreadSanitizer can't map its shadow memory with the runner's default address-space
      # randomization, and aborts before the first test.
      - name: Allow ThreadSanitizer's memory layout
        if: matrix.name == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake -S . -B build -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ ${{ matrix.flags }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
