# Mull (mutation testing) for the library's own code: occasional feedback, not a gate. Mutants in
# src/ only, never in the tests or GoogleTest. See tools/mutation.sh.
mutators:
  - cxx_all
includePaths:
  - .*/src/.*
excludePaths:
  - .*/_deps/.*
  - .*/test/.*
timeout: 30000 # ms per run of the whole test binary; it takes about 10 s under Mull
